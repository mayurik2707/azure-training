name: CI/CD - Spring Boot to Azure Web App

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # enables OIDC if you later switch to federated auth

env:
  AZURE_WEBAPP_NAME: as-app-dev-inst
  AZURE_WEBAPP_SLOT: staging         # <--- use your existing staging slot
  RESOURCE_GROUP: RG-app-infra-dev     # <--- set this to your RG
  JAVA_VERSION: '17'
  # Prefer liveness for slot warm‑up so DB outages don’t block swap readiness
  STAGING_HEALTH_URL: 'as-app-dev-inst-cgbramenhne7b9de.centralindia-01.azurewebsites.net/actuator/health/liveness'
  PROD_HEALTH_URL: 'as-app-dev-inst-cgbramenhne7b9de.centralindia-01.azurewebsites.net/actuator/health'

jobs:
  build-test:
    name: Build & Test (Maven)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Temurin Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'

      - name: Maven - Build with tests
        run: mvn -B -f "${{ github.workspace }}/azure-sql-java-demo/pom.xml" clean package

      - name: Archive build artifact (JAR)
        run: |
          mkdir -p artifact
          # Adjust the jar name pattern if your finalName is customized in pom.xml
          cp "${{ github.workspace }}/azure-sql-java-demo/target/"*.jar artifact/app.jar

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: spring-boot-jar
          path: artifact/app.jar
          if-no-files-found: error

  deploy:
    name: Deploy to Staging slot (Green)
    needs: build-test
    runs-on: ubuntu-latest
    # Keep the existing environment if others depend on it; or change to 'staging'
    environment:
      name: staging
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: spring-boot-jar
          path: .

      # Deploy to STAGING slot using the existing publish profile (unchanged action)
      - name: Deploy to Azure Web App (staging slot)
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: ${{ env.AZURE_WEBAPP_SLOT }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISHPROFILE }}
          package: app.jar
      # azure/webapps-deploy supports slot-name and JAR deploy as used here.

      # --- Optional pre-flight: uncomment if you want an extra early check ---
      # - name: Pre-flight HEAD to root (staging)
      #   run: |
      #     set -e
      #     curl -I --connect-timeout 15 --retry 5 --retry-delay 3 \
      #       https://${{ env.AZURE_WEBAPP_NAME }}-${{ env.AZURE_WEBAPP_SLOT }}.azurewebsites.net

      - name: Warm-up & Health check (staging)
        run: |
          set -e
          echo "Checking ${STAGING_HEALTH_URL}"
          # Require 3 consecutive 200s to reduce flakiness during startup
          ok=0
          for i in {1..60}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" \
              --connect-timeout 30 --retry 4 --retry-delay 5 --retry-all-errors \
              "${STAGING_HEALTH_URL}" || echo "000")
            echo "Attempt $i => HTTP $code"
            if [ "$code" -eq 200 ]; then
              ok=$((ok+1))
              if [ $ok -ge 3 ]; then
                echo "Staging is healthy (3 consecutive 200s)."
                exit 0
              fi
            else
              ok=0
            fi
            sleep 5
          done
          echo "Staging health check failed."
          exit 1
        # Warming a slot before swap improves reliability & avoids long swaps.

  swap:
    name: Swap Staging → Production (Blue-Green)
    needs: deploy
    if: ${{ needs.deploy.result == 'success' }}   # <-- gate: swap runs only if warm-up succeeded
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - name: Azure login (Service Principal)
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Final gate: verify staging still healthy before swap (triple-check)
      - name: Verify staging still healthy (pre-swap)
        run: |
          set -e
          echo "Final gate: ${STAGING_HEALTH_URL}"
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "${STAGING_HEALTH_URL}")
            echo "Gate probe $i => HTTP $code"
            [ "$code" -eq 200 ] || { echo "Gate failed"; exit 1; }
            sleep 2
          done

      - name: Swap slots
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -e
            az webapp deployment slot swap \
              --resource-group $RESOURCE_GROUP \
              --name $AZURE_WEBAPP_NAME \
              --slot $AZURE_WEBAPP_SLOT \
              --target-slot production
        # 'az webapp deployment slot swap' is the supported way to swap slots.

      - name: Post-swap health check (production)
        id: prod-health
        run: |
          set -e
          for i in {1..30}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "${PROD_HEALTH_URL}")
            echo "Attempt $i => HTTP $code"
            if [ "$code" -eq 200 ]; then
              echo "Production is healthy."
              exit 0
            fi
            sleep 5
          done
          echo "Production health check failed."
          exit 1

  rollback:
    name: Rollback (Swap back to previous)
    needs: swap
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Azure login (Service Principal)
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Swap back
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -e
            az webapp deployment slot swap \
              --resource-group $RESOURCE_GROUP \
              --name $AZURE_WEBAPP_NAME \
              --slot $AZURE_WEBAPP_SLOT \
              --target-slot production
